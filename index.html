<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Same-origin only: no fonts, scripts, images or beacons from anywhere else. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'"
    />
    <meta name="referrer" content="no-referrer" />
    <title>Bunker: an old phone as an offline BNB Smart Chain wallet</title>
    <meta name="description" content="Bunker is a free, open-source Android app that turns an old phone into an offline hardware wallet for BNB Smart Chain. Pairs with MetaMask or Rabby over QR codes and clear-signs every transaction." />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="color-scheme" content="dark light" />
    <link rel="canonical" href="https://bunker.rotko.net/" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/atkinson-hyperlegible-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bunker" />
    <meta property="og:title" content="Bunker: an old phone as an offline BNB Smart Chain wallet" />
    <meta property="og:description" content="Free, open-source Android app. Pairs with MetaMask or Rabby over QR codes; the phone never goes online." />
    <meta property="og:url" content="https://bunker.rotko.net/" />
    <meta property="og:image" content="https://bunker.rotko.net/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Bunker: old phone, new vault. Offline signer for BNB Smart Chain." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bunker.rotko.net/og.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MobileApplication",
        "name": "Bunker",
        "operatingSystem": "Android 8.0 or newer",
        "applicationCategory": "FinanceApplication",
        "description": "Offline signer for BNB Smart Chain. Pairs with MetaMask or Rabby over QR codes (ERC-4527).",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
        "author": { "@type": "Organization", "name": "Rotko Networks", "url": "https://rotko.net" },
        "license": "https://www.apache.org/licenses/LICENSE-2.0",
        "url": "https://bunker.rotko.net/"
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p>Bunker turns an old Android phone into an offline hardware wallet for BNB Smart Chain. This page needs JavaScript to render.</p>
    </noscript>
    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
